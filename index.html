<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokonova</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Theme toggle button (top-left, always visible) -->
    <button id="theme-btn" type="button" aria-label="Change theme" title="Theme: Classic" class="btn-icon fixed top-3 left-3 sm:top-5 sm:left-5 z-[70] px-3 py-2 flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 theme-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
        </svg>
        <span id="theme-label" class="theme-accent">Classic</span>
    </button>

    <!-- Home button (bottom-left, always visible) -->
    <button id="home-btn" type="button" aria-label="Back to home" title="Back to home" class="hidden btn-icon fixed bottom-3 left-3 sm:bottom-5 sm:left-5 z-[70] px-3 py-2 flex items-center gap-2 text-xs font-bold uppercase tracking-wider">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 theme-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 11l9-8 9 8M5 10v10h5v-6h4v6h5V10" />
        </svg>
        <span class="theme-accent">Home</span>
    </button>

    <!-- Header -->
    <div class="w-full max-w-2xl px-4 sm:px-6 mt-12 sm:mt-0 mb-4 sm:mb-6 flex flex-col md:flex-row justify-between items-center gap-3 sm:gap-4">
        <div class="text-center md:text-left">
            <h1 class="title text-3xl">Sokonova</h1>
            <div class="flex items-center justify-center md:justify-start gap-2 mt-1">
                <p id="level-display" class="text-slate-400 font-semibold">Level 1</p>
                <span id="code-badge" class="hidden text-xs font-mono font-bold tracking-widest uppercase px-2 py-0.5 rounded-md badge-accent"></span>
            </div>
        </div>

        <div class="flex items-center gap-2 sm:gap-3">
            <div class="pill px-3 sm:px-5 py-2 text-center min-w-[110px] sm:min-w-[130px]">
                <p class="text-[11px] text-slate-400 uppercase tracking-widest mb-1 font-bold">Pushes</p>
                <p id="pushes-display" class="text-xl font-mono font-bold theme-accent">0</p>
            </div>

            <div class="pill px-3 sm:px-5 py-2 text-center min-w-[110px] sm:min-w-[130px]">
                <p class="text-[11px] text-slate-400 uppercase tracking-widest mb-1 font-bold">Time</p>
                <p id="timer-display" class="text-xl font-mono font-bold">Unlimited</p>
            </div>

            <button onclick="restartCurrentLevel()" class="btn-icon p-3 flex items-center justify-center" title="Restart level">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 theme-accent" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Board -->
    <div id="game-board"></div>

    <!-- Hint -->
    <div class="text-slate-400 text-sm mt-2 text-center px-4">
        <span class="only-keyboard">Move with <kbd>Arrows</kbd> or <kbd>WASD</kbd>.</span>
        <span class="only-touch">Swipe on the screen to move.</span>
    </div>

    <!-- Modal window -->
    <div id="modal-overlay" class="modal-hidden fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center">
        <div class="p-8 rounded-2xl text-center max-w-sm w-full mx-4 transform transition-transform scale-95" id="modal-content">
            <h2 id="modal-title" class="text-2xl font-extrabold mb-3 text-white">Title</h2>
            <p id="modal-message" class="text-slate-300 mb-6 text-lg">Message</p>
            <button id="modal-btn" class="w-full font-bold py-3 px-6 rounded-xl">
                OK
            </button>
        </div>
    </div>

    <!-- Welcome screen -->
    <div id="start-overlay" class="fixed inset-0 z-[60] flex flex-col items-center justify-center cursor-pointer transition-opacity duration-500">
        <!-- Code box (top-right) -->
        <div id="password-box" class="fixed top-3 right-3 sm:top-5 sm:right-5 flex flex-col items-end gap-1.5 cursor-default" onclick="event.stopPropagation()">
            <div class="flex items-center gap-2">
                <input
                    id="code-input"
                    type="text"
                    maxlength="5"
                    placeholder="CODE"
                    autocomplete="off"
                    spellcheck="false"
                    class="code-field w-28 sm:w-32 text-center font-mono font-bold uppercase tracking-[0.25em] placeholder-slate-500 rounded-xl px-3 py-2 text-sm focus:outline-none"
                />
                <button
                    id="code-btn"
                    type="button"
                    aria-label="Send code"
                    class="btn-icon p-2 flex items-center justify-center theme-accent"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M13 7l5 5m0 0l-5 5m5-5H6" />
                    </svg>
                </button>
            </div>
            <p id="code-error" class="text-xs text-red-400 h-4 pr-1"></p>
        </div>

        <div class="logo-crate"></div>
        <h1 class="title text-5xl mb-3">Sokonova</h1>
        <p class="text-slate-300 text-lg animate-pulse text-center px-4">
            <span class="only-touch">Swipe to start</span>
            <span class="only-keyboard">Press any key to start</span>
        </p>
    </div>

    <!-- Game logic and levels -->
    <script src="levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
