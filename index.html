<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sokonova</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg-top: #1f1846;
            --bg-bottom: #0a0817;
            --panel: #1c1636;
            --panel-border: rgba(255, 255, 255, 0.08);
            --wall-base: #4a3d63;
            --mortar: #2a2140;
            --floor: #2a2443;
            --gold: #fbbf24;
            --crate-a: #d69a55;
            --crate-b: #9c6532;
            --crate-line: #5c3a1c;
            --cell: clamp(24px, min(7vw, 6.5vh), 56px);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #f1f5f9;
            font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
            background:
                radial-gradient(900px 500px at 50% -10%, #3a2d7a 0%, transparent 65%),
                linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Intestazione */
        .title {
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(90deg, #fcd34d, #fb923c 45%, #f472b6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 20px rgba(251, 146, 60, 0.25);
        }

        .pill {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            box-shadow: 0 8px 20px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .btn-icon {
            background: linear-gradient(180deg, #3b3266, #2a2350);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.08);
            transition: transform 0.15s ease, filter 0.15s ease;
            cursor: pointer;
        }
        
        .btn-icon:hover { filter: brightness(1.15); }
        .btn-icon:active { transform: scale(0.94); }

        /* Tabellone */
        #game-board {
            display: grid;
            gap: 3px;
            padding: 12px;
            border-radius: 20px;
            background: linear-gradient(160deg, #332a57, #1d1734);
            box-shadow:
                0 0 0 1px rgba(255, 255, 255, 0.06),
                0 30px 60px -20px rgba(0, 0, 0, 0.75),
                inset 0 1px 0 rgba(255, 255, 255, 0.08);
            margin-bottom: 1.5rem;
        }

        .cell {
            width: var(--cell);
            height: var(--cell);
            border-radius: 6px;
            position: relative;
        }

        /* Muro in mattoni */
        .wall {
            background-color: var(--wall-base);
            background-image:
                linear-gradient(var(--mortar) 2px, transparent 2px),
                linear-gradient(180deg, rgba(255, 255, 255, 0.16), rgba(0, 0, 0, 0.28));
            background-size: 100% 33.4%, 100% 100%;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
        }

        /* Pavimento */
        .floor {
            background-color: var(--floor);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
        }

        /* Destinazione: rombo dorato luminoso */
        .target {
            background-color: var(--floor);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.035);
        }
        
        .target::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 46%;
            height: 46%;
            transform: translate(-50%, -50%) rotate(45deg);
            border: 2px solid var(--gold);
            border-radius: 3px;
            background: rgba(251, 191, 36, 0.12);
            box-shadow: 0 0 12px rgba(251, 191, 36, 0.45), inset 0 0 6px rgba(251, 191, 36, 0.35);
            pointer-events: none;
        }

        /* Cassa in legno con assi incrociate */
        .box,
        .box-on-target {
            border-radius: 5px;
            background: linear-gradient(160deg, var(--crate-a), var(--crate-b));
            box-shadow:
                inset 0 0 0 2px var(--crate-line),
                inset 0 2px 0 rgba(255, 255, 255, 0.25),
                0 3px 6px rgba(0, 0, 0, 0.45);
            z-index: 10;
        }
        .box::before,
        .box-on-target::before {
            content: '';
            position: absolute;
            inset: 12%;
            border-radius: 2px;
            background:
                linear-gradient(45deg, transparent 46%, var(--crate-line) 46%, var(--crate-line) 54%, transparent 54%),
                linear-gradient(-45deg, transparent 46%, var(--crate-line) 46%, var(--crate-line) 54%, transparent 54%);
            pointer-events: none;
        }

        /* Cassa sulla destinazione: verde con bagliore */
        .box-on-target {
            --crate-a: #6ee7a0;
            --crate-b: #16a34a;
            --crate-line: #14532d;
            box-shadow:
                inset 0 0 0 2px var(--crate-line),
                inset 0 2px 0 rgba(255, 255, 255, 0.3),
                0 0 14px rgba(74, 222, 128, 0.55);
        }

        /* Cassa sulla destinazione: segno di spunta al posto della X */
        .box-on-target::before {
            content: '';
            inset: auto;
            left: 36%;
            top: 28%;
            width: 22%;
            height: 40%;
            background: none;
            border-radius: 0;
            border-right: 3px solid #f0fdf4;
            border-bottom: 3px solid #f0fdf4;
            transform: rotate(45deg);
            filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.4));
        }

        /* Giocatore: sfera blu con riflesso */
        .player {
            z-index: 20;
        }
        
        .player::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            width: 64%;
            height: 64%;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #bfdbfe 0%, #3b82f6 45%, #1e3a8a 100%);
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.5), 0 0 0 2px rgba(15, 23, 42, 0.6);
            pointer-events: none;
        }

        .empty {
            background: transparent;
        }

        /* Finestra modale */
        #modal-overlay {
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: opacity 0.3s ease;
        }
        
        .modal-hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .modal-active {
            opacity: 1;
            pointer-events: auto;
        }
        
        #modal-content {
            background: linear-gradient(180deg, #2a2350, #1a1534);
            border: 1px solid rgba(251, 191, 36, 0.25);
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.8), 0 0 40px -10px rgba(251, 191, 36, 0.2);
        }
        
        #modal-btn {
            background: linear-gradient(180deg, #fbbf24, #f59e0b);
            color: #1c1636;
            box-shadow: 0 8px 20px -6px rgba(245, 158, 11, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        
        #modal-btn:hover { filter: brightness(1.08); }
        #modal-btn:active { transform: scale(0.97); }

        /* Schermata iniziale */
        .logo-crate {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            background: linear-gradient(160deg, var(--crate-a), var(--crate-b));
            box-shadow:
                inset 0 0 0 3px var(--crate-line),
                inset 0 3px 0 rgba(255, 255, 255, 0.25),
                0 12px 24px -8px rgba(0, 0, 0, 0.6);
            position: relative;
            margin-bottom: 1.25rem;
        }
        
        .logo-crate::before {
            content: '';
            position: absolute;
            inset: 14%;
            border-radius: 3px;
            background:
                linear-gradient(45deg, transparent 46%, var(--crate-line) 46%, var(--crate-line) 54%, transparent 54%),
                linear-gradient(-45deg, transparent 46%, var(--crate-line) 46%, var(--crate-line) 54%, transparent 54%);
        }

        .hint-card {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 14px;
            padding: 1rem;
            text-align: center;
            min-width: 130px;
            box-shadow: 0 8px 20px -10px rgba(0, 0, 0, 0.6);
        }

        /* Modalità in base al dispositivo (impostata da game.js) */
        body[data-mode="touch"] .only-keyboard,
        body[data-mode="keyboard"] .only-touch {
            display: none !important;
        }

        kbd {
            background: #2a2350;
            border: 1px solid var(--panel-border);
            border-bottom-width: 2px;
            border-radius: 6px;
            padding: 1px 6px;
            color: #e2e8f0;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }
    </style>
</head>
<body>

    <!-- Intestazione -->
    <div class="w-full max-w-2xl px-6 mb-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <div class="text-center md:text-left">
            <h1 class="title text-3xl">Sokonova</h1>
            <p id="level-display" class="text-slate-400 font-semibold mt-1">Livello 1</p>
        </div>

        <div class="flex items-center gap-4">
            <div class="pill px-5 py-2 text-center min-w-[140px]">
                <p class="text-[11px] text-slate-400 uppercase tracking-widest mb-1 font-bold">Tempo</p>
                <p id="timer-display" class="text-xl font-mono font-bold">Illimitato</p>
            </div>

            <button onclick="restartCurrentLevel()" class="btn-icon p-3 flex items-center justify-center" title="Riavvia livello">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-amber-300" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Tabellone -->
    <div id="game-board"></div>

    <!-- Istruzioni -->
    <div class="text-slate-400 text-sm mt-2 text-center px-4">
        <span class="only-keyboard">Muoviti con <kbd>Frecce</kbd> o <kbd>WASD</kbd>.</span>
        <span class="only-touch">Scorri il dito sullo schermo per muovere il magazziniere.</span>
    </div>

    <!-- Finestra modale -->
    <div id="modal-overlay" class="modal-hidden fixed inset-0 bg-slate-950/70 z-50 flex items-center justify-center">
        <div class="p-8 rounded-2xl text-center max-w-sm w-full mx-4 transform transition-transform scale-95" id="modal-content">
            <h2 id="modal-title" class="text-2xl font-extrabold mb-3 text-white">Titolo</h2>
            <p id="modal-message" class="text-slate-300 mb-6 text-lg">Messaggio</p>
            <button id="modal-btn" class="w-full font-bold py-3 px-6 rounded-xl">
                OK
            </button>
        </div>
    </div>

    <!-- Schermata iniziale -->
    <div id="start-overlay" class="fixed inset-0 z-[60] flex flex-col items-center justify-center cursor-pointer transition-opacity duration-500"
         style="background: radial-gradient(900px 500px at 50% -10%, #3a2d7a 0%, transparent 65%), linear-gradient(180deg, #1f1846, #0a0817);">
        <div class="logo-crate"></div>
        <h1 class="title text-5xl mb-3">Sokonova</h1>
        <p class="text-slate-300 text-lg mb-8 animate-pulse text-center px-4">
            <span class="only-touch">Tocca lo schermo per iniziare</span>
            <span class="only-keyboard">Premi un tasto iniziare</span>
        </p>
        <div class="flex gap-4">
            <div class="hint-card only-keyboard">
                <p class="text-slate-400 text-sm">Frecce o WASD</p>
            </div>
            <div class="hint-card only-touch">
                <p class="text-slate-400 text-sm">Swipe (scorri)</p>
            </div>
        </div>
    </div>

    <!-- Logica di gioco e livelli: vedi game.js -->
    <script src="levels.js"></script>
    <script src="game.js"></script>
</body>
</html>
